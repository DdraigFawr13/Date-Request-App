name: Test & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One queue per branch or PR. A newer push to a PR replaces its older test run,
# but a deploy of main is never cancelled by another run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp this release on the code so browsers never mix in stale cached
      # files: version.txt holds the id, and every module import carries it.
      - name: Stamp the release id
        run: |
          v="${GITHUB_SHA::12}"
          echo "$v" > version.txt
          sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$v'#g" js/*.js
          if grep -nE "from '[^']+\.js'" js/*.js; then echo "Unstamped imports remain" >&2; exit 1; fi
          grep -c "?v=$v" js/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
